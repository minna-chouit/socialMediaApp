name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm trace

  db:
    name: Database (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase db start
      - name: pgTAP
        shell: bash
        run: |
          set -o pipefail
          pnpm test:db 2>&1 | tee pgtap.out
      # Logs need a GitHub login; annotations do not, so the output is readable from the API.
      - name: Publish pgTAP output
        if: always()
        shell: bash
        run: echo "::notice title=pgTAP output::$(tail -c 60000 pgtap.out | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
