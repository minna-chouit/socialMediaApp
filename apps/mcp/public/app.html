<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>Cadence</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cadence" />
    <meta name="theme-color" content="#141413" />
    <style>
      :root {
        --bg: #f6f5f2;
        --card: #fff;
        --ink: #1c1b19;
        --muted: #6b6860;
        --line: #e4e1da;
        --accent: #3d5afe;
        --warn: #b26a00;
        --err: #c62828;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141413;
          --card: #1f1e1c;
          --ink: #eceae4;
          --muted: #a19e95;
          --line: #34322e;
          --accent: #8c9eff;
          --warn: #ffb74d;
          --err: #ef9a9a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.45 system-ui,
          sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
        padding: 12px 16px 0;
        z-index: 1;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      nav {
        display: flex;
        gap: 4px;
      }
      nav button {
        flex: 1;
        border: 0;
        background: none;
        color: var(--muted);
        padding: 10px 0;
        font: inherit;
        border-bottom: 3px solid transparent;
        min-height: 44px;
      }
      nav button[aria-selected='true'] {
        color: var(--ink);
        border-color: var(--accent);
        font-weight: 600;
      }
      main {
        padding: 16px;
        max-width: 720px;
        margin: 0 auto;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 12px;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .muted {
        color: var(--muted);
        font-size: 14px;
      }
      .pill {
        font-size: 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 2px 8px;
      }
      .warning {
        color: var(--warn);
        font-size: 14px;
      }
      .error {
        color: var(--err);
        font-size: 14px;
      }
      button.act,
      input,
      select,
      textarea {
        font: inherit;
        min-height: 44px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        padding: 8px 12px;
      }
      button.act {
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      input,
      textarea,
      select {
        width: 100%;
      }
      label {
        display: block;
        margin: 10px 0 4px;
        font-size: 14px;
        color: var(--muted);
      }
      ul {
        margin: 6px 0 0;
        padding-left: 18px;
      }
      #toast {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: 16px;
        padding: 12px 14px;
        border-radius: 10px;
        background: var(--ink);
        color: var(--bg);
        display: none;
      }
      dialog {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--card);
        color: var(--ink);
        width: min(640px, calc(100% - 32px));
      }
      dialog::backdrop {
        background: rgb(0 0 0 / 0.4);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Cadence</h1>
      <nav role="tablist">
        <button role="tab" data-tab="today" aria-selected="true">Today</button>
        <button role="tab" data-tab="inbox" aria-selected="false">Inbox</button>
        <button role="tab" data-tab="week" aria-selected="false">Week</button>
        <button role="tab" data-tab="ideas" aria-selected="false">Ideas</button>
        <button role="tab" data-tab="stats" aria-selected="false">Stats</button>
      </nav>
    </header>
    <main id="main" aria-live="polite"></main>
    <dialog id="editor"></dialog>
    <div id="toast" role="status"></div>
    <script>
      // The secret is the last path segment (/app/<secret>); it is sent as a header, never in a query.
      const KEY = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
      const main = document.getElementById('main');
      let tab = 'today';
      let weekOffset = 0;

      const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
      const when = (iso) =>
        iso
          ? new Date(iso).toLocaleString([], {
              weekday: 'short',
              day: 'numeric',
              month: 'short',
              hour: '2-digit',
              minute: '2-digit',
            })
          : '';
      // A local datetime-local value for an ISO time with offset, and back.
      const toInput = (iso) => (iso ? iso.slice(0, 16) : '');
      const fromInput = (value, iso) =>
        value ? `${value}:00${(iso || '').slice(19) || offset()}` : null;
      const offset = () => {
        const m = -new Date().getTimezoneOffset();
        return `${m < 0 ? '-' : '+'}${String(Math.floor(Math.abs(m) / 60)).padStart(2, '0')}:${String(Math.abs(m) % 60).padStart(2, '0')}`;
      };

      function toast(text) {
        const t = document.getElementById('toast');
        t.textContent = text;
        t.style.display = 'block';
        clearTimeout(toast.timer);
        toast.timer = setTimeout(() => (t.style.display = 'none'), 3000);
      }

      async function api(action, args = {}) {
        const response = await fetch('/api/app', {
          method: 'POST',
          headers: { 'content-type': 'application/json', 'x-cadence-key': KEY },
          body: JSON.stringify({ action, args }),
        });
        if (response.status === 404)
          throw new Error('This link is not valid. Check the secret in the URL.');
        // A crashed or timed-out function replies with plain text; show it instead of a JSON parse error.
        const text = await response.text();
        let body;
        try {
          body = JSON.parse(text);
        } catch {
          throw new Error(`Server error ${response.status} on "${action}": ${text.slice(0, 160)}`);
        }
        if (!response.ok) throw new Error(body.error || 'Something went wrong');
        return body;
      }

      async function act(action, args, done) {
        try {
          await api(action, args);
          toast(done);
          render();
        } catch (e) {
          toast(e.message);
        }
      }

      const warnings = (list) =>
        list.length
          ? `<ul>${list.map((w) => `<li class="${w.severity === 'error' ? 'error' : 'warning'}">${esc(w.rule)}: ${esc(w.message)}</li>`).join('')}</ul>`
          : '<p class="muted">No balance warnings.</p>';

      const variants = (post) =>
        post.variants
          .map(
            (
              v,
            ) => `<div class="row muted"><span class="pill">${esc(v.platform)} · ${esc(v.format)}</span>
              ${v.hook ? `“${esc(v.hook)}”` : ''} ${v.postedAt ? `<span>posted ${esc(when(v.postedAt))}</span>` : ''}</div>`,
          )
          .join('');

      async function renderInbox() {
        const items = await api('inbox');
        if (!items.length)
          return '<p class="muted">Nothing waiting. Proposals from Claude appear here.</p>';
        return items
          .map(
            ({ post, warnings: w }) => `<article class="card">
              <div class="row"><strong>${esc(post.title)}</strong><span class="pill">${esc(post.pillar)}</span></div>
              <p class="muted">${esc(when(post.goLiveAt))}${post.notes ? ` · ${esc(post.notes)}` : ''}</p>
              ${variants(post)}
              <details style="margin:8px 0"><summary class="muted">If approved: ${w.length} balance warning${w.length === 1 ? '' : 's'}</summary>${warnings(w)}</details>
              <div class="row">
                <button class="act primary" data-approve="${post.id}">Approve</button>
                <button class="act" data-edit="${post.id}">Edit</button>
                <button class="act" data-reject="${post.id}">Reject</button>
              </div>
            </article>`,
          )
          .join('');
      }

      async function renderWeek() {
        const week = await api('week', { offset: weekOffset });
        const byPost = new Map();
        for (const item of week.items) {
          if (!byPost.has(item.postId)) byPost.set(item.postId, { ...item, variants: [] });
          byPost.get(item.postId).variants.push(item);
        }
        const posts = [...byPost.values()];
        return `<div class="row" style="justify-content:space-between;margin-bottom:12px">
            <button class="act" data-week="-1" aria-label="Previous week">←</button>
            <strong>${esc(week.weekStart)} – ${esc(week.weekEnd)}</strong>
            <button class="act" data-week="1" aria-label="Next week">→</button>
          </div>
          ${posts.length ? '' : '<p class="muted">Nothing planned this week.</p>'}
          ${posts
            .map(
              (p) => `<article class="card">
                <div class="row"><strong>${esc(p.title)}</strong><span class="pill">${esc(p.stage)}</span><span class="pill">${esc(p.pillar)}</span></div>
                ${p.variants
                  .map(
                    (v) => `<div class="row" style="margin-top:8px">
                      <span class="muted">${esc(v.platform)} · ${esc(v.format)} · ${esc(when(v.goLiveAt))}</span>
                      ${v.postedAt ? '<span class="pill">posted</span>' : `<button class="act" data-posted="${v.variantId}">Mark posted</button>`}
                    </div>`,
                  )
                  .join('')}
                ${week.tasks
                  .filter((t) => t.postId === p.postId)
                  .map(
                    (t) =>
                      `<p class="muted" style="margin:6px 0">${t.done ? '✓' : '○'} ${esc(t.title)} · ${esc(t.type)} · ${esc(when(t.dueAt))} ${claudeBadge(t)}</p>`,
                  )
                  .join('')}
                <div class="row" style="margin-top:10px">
                  ${p.stage === 'proposed' ? `<button class="act primary" data-approve="${p.postId}">Approve</button>` : `<button class="act" data-advance="${p.postId}">Next stage</button>`}
                  <button class="act" data-edit="${p.postId}">Edit</button>
                </div>
              </article>`,
            )
            .join('')}
          <details class="card"><summary>Balance for this week (${week.warnings.length})</summary>${warnings(week.warnings)}</details>`;
      }

      async function renderIdeas() {
        const ideas = await api('ideas');
        return `<form class="card" id="new-idea">
            <label for="idea-text">New idea</label>
            <textarea id="idea-text" rows="2" required placeholder="What could you post?"></textarea>
            <div class="row" style="margin-top:8px"><button class="act primary" type="submit">Add idea</button></div>
          </form>
          ${ideas
            .map(
              (i) => `<article class="card">
                <div class="row"><span>${esc(i.text)}</span><span class="pill">${esc(i.status)}</span></div>
                ${i.latestVerdict ? `<p class="muted">Claude: ${esc(i.latestVerdict.verdict)} (${esc(i.latestVerdict.total)}/15) · ${esc(i.latestVerdict.notes)}</p>` : ''}
              </article>`,
            )
            .join('')}`;
      }

      const REMINDER_TEXT = {
        SHOT_LIST: 'Make the shot list for this week',
        WEEKLY_REPORT: 'Weekly report: log follower counts, then send the report to Claude',
        BATCH_NIGHT: 'Batch night with Claude: plan, judge ideas, write captions',
        SCHEDULE: 'Schedule next week’s approved posts in each app',
        POST_NOW: 'Post now',
        REPLY_START: 'Reply window starts: answer comments',
        REPLY_END: 'Reply window ends',
        CHECKIN: 'Log check-in metrics',
        MISSED: 'Missed yesterday: post it or swap in a leftovers post',
        LI_CAPTURE: 'Capture one piece of real work for LinkedIn',
        LI_FALLBACK: 'No LinkedIn capture yet: write a reflection post instead',
        MILESTONE: 'Milestone review',
        MONTHLY_REVIEW: 'Monthly review (about an hour)',
        TRIGGER: 'Strategy trigger fired: review with Claude',
      };
      const time = (iso) =>
        new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      // Push setup (FR-14). The key is fetched ahead so the permission prompt runs straight from the tap,
      // which iOS requires; iOS also only allows push from the Home Screen app (16.4+).
      let pushKey = null;
      const isIOS = /iPhone|iPad/.test(navigator.userAgent);
      const pushReady = () =>
        'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
      const base64ToBytes = (b64) => {
        const padded = (b64 + '='.repeat((4 - (b64.length % 4)) % 4))
          .replace(/-/g, '+')
          .replace(/_/g, '/');
        return Uint8Array.from(atob(padded), (c) => c.charCodeAt(0));
      };
      function pushBanner() {
        if (!pushReady()) {
          return isIOS
            ? '<p class="card muted">For notifications on iPhone: tap Share, then Add to Home Screen, and open Cadence from there.</p>'
            : '';
        }
        if (Notification.permission === 'granted') return '';
        if (Notification.permission === 'denied') {
          return '<p class="card muted">Notifications are blocked for Cadence in your settings.</p>';
        }
        return '<div class="card row"><span style="flex:1">Get reminders on this device</span><button class="act primary" data-enable-push="1">Turn on notifications</button></div>';
      }
      async function subscribePush() {
        const registration = await navigator.serviceWorker.register('/sw.js', { scope: '/app/' });
        await navigator.serviceWorker.ready;
        const subscription =
          (await registration.pushManager.getSubscription()) ||
          (await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: base64ToBytes(pushKey),
          }));
        await api('subscribe', {
          subscription: subscription.toJSON(),
          deviceLabel: isIOS ? 'iPhone' : 'Browser',
        });
      }
      async function enablePush() {
        if (!pushKey) return toast('Push is not set up on the server yet.');
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') return toast('Notifications were not allowed.');
        await subscribePush();
        toast('Notifications are on for this device');
        render();
      }

      const TASK_TYPES = ['shoot', 'edit', 'write', 'post', 'log', 'other'];
      const typeOptions = (selected) =>
        TASK_TYPES.map((t) => `<option ${t === selected ? 'selected' : ''}>${t}</option>`).join('');
      const claudeBadge = (t) =>
        t.createdBy === 'claude' ? '<span class="pill">Claude</span>' : '';
      // Default due time for a new task: today at 18:00 local.
      const todayAt18 = () => {
        const d = new Date();
        d.setHours(18, 0, 0, 0);
        return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
      };
      const taskRow = (t) => `<label class="row" style="margin:6px 0;color:var(--ink)">
          <input type="checkbox" data-task-done="${t.id}" ${t.done ? 'checked' : ''} style="width:24px;min-height:24px" />
          <span style="flex:1${t.done ? ';text-decoration:line-through;color:var(--muted)' : ''}">${esc(t.title)}</span>
          <span class="pill">${esc(t.type)}</span>${claudeBadge(t)}
          <span class="${t.overdue ? 'error' : 'muted'}">${esc(when(t.dueAt))}</span>
        </label>`;

      async function renderTasksToday() {
        const tasks = await api('tasks_today');
        return `<section class="card">
            <h2 style="margin:0 0 6px;font-size:18px">Tasks</h2>
            ${tasks.length ? tasks.map((t) => taskRow(t) + (t.postTitle ? `<p class="muted" style="margin:-4px 0 6px 32px">${esc(t.postTitle)}</p>` : '')).join('') : '<p class="muted">No tasks due today.</p>'}
            <details style="margin-top:8px"><summary>Add a task</summary>
              <form id="new-task">
                <label for="nt-title">Task</label><input id="nt-title" name="title" required />
                <div class="row">
                  <label style="flex:1">Type<select name="type">${typeOptions('other')}</select></label>
                  <label style="flex:2">Due<input name="dueAt" type="datetime-local" value="${todayAt18()}" required /></label>
                </div>
                <button class="act primary" type="submit" style="margin-top:8px">Add task</button>
              </form>
            </details>
          </section>`;
      }

      async function renderToday() {
        const [reminders, key] = await Promise.all([
          api('today'),
          pushKey ? { publicKey: pushKey } : api('push_key'),
        ]);
        pushKey = key.publicKey;
        // Keep this device's subscription fresh if notifications are already allowed.
        if (pushReady() && Notification.permission === 'granted' && pushKey)
          subscribePush().catch(() => {});
        const tasksSection = await renderTasksToday();
        if (!reminders.length) {
          return pushBanner() + tasksSection + '<p class="muted">No reminders left for today.</p>';
        }
        return (
          pushBanner() +
          tasksSection +
          reminders
            .map(
              (r) => `<article class="card row">
              <strong style="min-width:56px">${esc(time(r.at))}</strong>
              <span>${esc(REMINDER_TEXT[r.code] || r.code)}${r.about ? ` · <span class="muted">${esc(r.about)}</span>` : ''}</span>
              ${r.urgent ? '<span class="pill">now</span>' : ''}
            </article>`,
            )
            .join('')
        );
      }

      const METRIC_FIELDS = [
        'views',
        'reach',
        'likes',
        'comments',
        'saves',
        'shares',
        'follows',
        'avgWatchSeconds',
      ];
      const METRIC_LABEL = { avgWatchSeconds: 'avg watch (s)' };

      async function renderStats() {
        const [checkins, followers, report] = await Promise.all([
          api('checkins'),
          api('followers'),
          api('report'),
        ]);
        const r = report.live;
        const pct = (rate) => (rate === null ? '–' : `${Math.round(rate * 100)}%`);
        const latest = {};
        for (const h of followers.history) latest[h.platform] = h.count;
        return `<section class="card">
            <h2 style="margin:0 0 8px;font-size:18px">Check-ins</h2>
            ${checkins.length ? '' : '<p class="muted">No check-ins due.</p>'}
            ${checkins
              .map(
                (c) => `<form class="card" data-checkin="${c.id}">
                  <div class="row"><strong>${esc(c.title)}</strong><span class="pill">${esc(c.platform)} · day ${esc(c.dayOffset)}</span>
                  ${c.overdue ? '<span class="error">overdue</span>' : `<span class="muted">due ${esc(when(c.dueAt))}</span>`}</div>
                  <div class="row" style="margin-top:8px">${METRIC_FIELDS.map(
                    (f) =>
                      `<label style="flex:1 1 30%;margin:0">${esc(METRIC_LABEL[f] || f)}<input name="${f}" inputmode="numeric" pattern="[0-9]*" /></label>`,
                  ).join('')}</div>
                  <p class="muted">Leave a field empty if the app does not show it.</p>
                  <button class="act primary" type="submit">Save check-in</button>
                </form>`,
              )
              .join('')}
          </section>
          <section class="card">
            <h2 style="margin:0 0 8px;font-size:18px">Followers · week of ${esc(followers.weekStart)}</h2>
            <form id="followers-form" class="row">
              <select name="platform" aria-label="Platform">${['instagram', 'tiktok', 'linkedin'].map((p) => `<option ${followers.missing[0] === p ? 'selected' : ''}>${p}</option>`).join('')}</select>
              <input name="count" inputmode="numeric" pattern="[0-9]*" placeholder="Followers" aria-label="Follower count" required style="flex:1" />
              <button class="act primary" type="submit">Save</button>
            </form>
            <p class="muted">${followers.missing.length ? `Still to log this week: ${esc(followers.missing.join(', '))}` : 'All logged this week.'}</p>
            <p>${
              Object.entries(latest)
                .map(([p, n]) => `<span class="pill">${esc(p)} ${esc(n)}</span>`)
                .join(' ') || '<span class="muted">No counts yet.</span>'
            }</p>
          </section>
          <section class="card">
            <h2 style="margin:0 0 8px;font-size:18px">This week · ${esc(r.weekStart)}</h2>
            <p>Done ${esc(r.total.done)} of ${esc(r.total.planned)} planned (${pct(r.total.completionRate)})</p>
            <p class="muted">${Object.entries(r.platforms)
              .map(([p, s]) => `${esc(p)} ${esc(s.done)}/${esc(s.planned)}`)
              .join(' · ')}</p>
            <p class="muted">Check-ins done ${esc(r.checkins.done)}, overdue ${esc(r.checkins.overdue)} · LinkedIn captured: ${r.linkedinCaptured ? 'yes' : 'no'}</p>
            ${r.missed.length ? `<p class="warning">Missed: ${r.missed.map((m) => esc(`${m.title} (${m.platform})`)).join(', ')}</p>` : ''}
            <button class="act primary" data-send-report="1">Send this week’s report to Claude</button>
            ${report.sent.length ? `<p class="muted">Sent: ${report.sent.map((s) => esc(s.weekStart)).join(', ')}</p>` : ''}
          </section>`;
      }

      async function render() {
        main.innerHTML = '<p class="muted">Loading…</p>';
        try {
          main.innerHTML = await {
            today: renderToday,
            inbox: renderInbox,
            week: renderWeek,
            ideas: renderIdeas,
            stats: renderStats,
          }[tab]();
        } catch (e) {
          main.innerHTML = `<p class="error">${esc(e.message)}</p>`;
        }
      }

      // Formats each platform supports (FR-4); the server checks them too.
      const FORMATS = {
        instagram: ['reel', 'carousel', 'photo', 'story'],
        tiktok: ['video', 'photo'],
        linkedin: ['text', 'image', 'document', 'video'],
      };
      const tags = (text) =>
        text
          .split(/[\s,]+/)
          .map((tag) => tag.replace(/^#/, ''))
          .filter(Boolean);

      async function openEditor(id) {
        const post = await api('post', { id });
        // FR-4 / FR-29: one variant per platform, so only free platforms can be added.
        const freePlatforms = Object.keys(FORMATS).filter(
          (p) => !post.variants.some((v) => v.platform === p),
        );
        const dialog = document.getElementById('editor');
        dialog.innerHTML = `<form method="dialog" id="edit-form">
            <h2 style="margin-top:0">Edit post</h2>
            <label for="e-title">Title</label><input id="e-title" value="${esc(post.title)}" required />
            <label for="e-date">Goes live</label><input id="e-date" type="datetime-local" value="${esc(toInput(post.goLiveAt))}" />
            <label for="e-notes">Notes</label><textarea id="e-notes" rows="2">${esc(post.notes)}</textarea>
            ${post.variants
              .map(
                (v) => `<fieldset class="card" data-variant="${v.id}">
                  <legend>${esc(v.platform)} · ${esc(v.format)} ${claudeBadge(v)}</legend>
                  <label>Hook</label><input data-f="hook" value="${esc(v.hook)}" />
                  <label>Caption</label><textarea data-f="caption" rows="3">${esc(v.caption)}</textarea>
                  <label>Hashtags</label><input data-f="hashtags" value="${esc((v.hashtags || []).map((t) => '#' + t).join(' '))}" placeholder="#campus #studentlife" />
                  <label>Scheduled at (optional)</label><input data-f="scheduledAt" type="datetime-local" value="${esc(toInput(v.scheduledAt))}" />
                  ${
                    v.postedAt
                      ? '<p class="muted">Posted, so it stays.</p>'
                      : post.variants.length > 1
                        ? `<label class="muted"><input type="checkbox" data-f="remove" style="width:20px;min-height:20px" /> Remove this variant</label>`
                        : '<p class="muted">The only variant. To drop it, reject or archive the post instead.</p>'
                  }
                </fieldset>`,
              )
              .join('')}
            ${
              freePlatforms.length
                ? `<fieldset class="card" data-new-variant><legend>Add a variant</legend>
                  <div class="row">
                    <label style="flex:1">Platform<select data-n="platform"><option value="">None</option>${freePlatforms.map((p) => `<option>${p}</option>`).join('')}</select></label>
                    <label style="flex:1">Format<select data-n="format"></select></label>
                    <label style="flex:1">Language<select data-n="language"><option>en</option><option>darija</option><option>mixed</option></select></label>
                  </div>
                  <label>Hook<input data-n="hook" /></label>
                  <label>Caption<textarea data-n="caption" rows="2"></textarea></label>
                  <label>Hashtags<input data-n="hashtags" placeholder="#campus #studentlife" /></label>
                  <label>Scheduled at (optional; empty goes live with the post)<input data-n="scheduledAt" type="datetime-local" /></label>
                </fieldset>`
                : ''
            }
            <fieldset class="card"><legend>Tasks</legend>
              ${(post.tasks || [])
                .map(
                  (t) => `<div class="row" data-task="${t.id}" style="margin-bottom:8px">
                    <input type="checkbox" data-t="done" ${t.done ? 'checked' : ''} aria-label="Done" style="width:24px;min-height:24px" />
                    <input data-t="title" value="${esc(t.title)}" aria-label="Task" style="flex:2" />
                    <select data-t="type" aria-label="Type" style="flex:1">${typeOptions(t.type)}</select>
                    <input data-t="dueAt" type="datetime-local" value="${esc(toInput(t.dueAt))}" aria-label="Due" style="flex:2" />
                    ${claudeBadge(t)}
                    <label class="muted" style="margin:0"><input type="checkbox" data-t="delete" style="width:20px;min-height:20px" /> delete</label>
                  </div>`,
                )
                .join('')}
              <div class="row" data-new-task>
                <input data-t="title" placeholder="New task for this post" aria-label="New task" style="flex:2" />
                <select data-t="type" aria-label="Type" style="flex:1">${typeOptions('other')}</select>
                <input data-t="dueAt" type="datetime-local" value="${esc(toInput(post.goLiveAt))}" aria-label="Due" style="flex:2" />
              </div>
            </fieldset>
            <div class="row"><button class="act primary" value="save">Save</button><button class="act" value="cancel" formnovalidate>Cancel</button></div>
          </form>`;
        dialog.showModal();
        const newPlatform = dialog.querySelector('[data-n="platform"]');
        if (newPlatform) {
          newPlatform.onchange = () => {
            dialog.querySelector('[data-n="format"]').innerHTML = (FORMATS[newPlatform.value] || [])
              .map((f) => `<option>${f}</option>`)
              .join('');
          };
        }
        dialog.onclose = async () => {
          if (dialog.returnValue !== 'save') return;
          try {
            await api('update_post', {
              id,
              patch: {
                title: dialog.querySelector('#e-title').value,
                notes: dialog.querySelector('#e-notes').value,
                goLiveAt: fromInput(dialog.querySelector('#e-date').value, post.goLiveAt),
              },
            });
            const removing = [];
            for (const fs of dialog.querySelectorAll('[data-variant]')) {
              const v = post.variants.find((x) => x.id === fs.dataset.variant);
              if (fs.querySelector('[data-f="remove"]')?.checked) {
                removing.push(v);
                continue;
              }
              const value = (f) => fs.querySelector(`[data-f="${f}"]`).value;
              await api('update_variant', {
                id: v.id,
                patch: {
                  hook: value('hook'),
                  caption: value('caption'),
                  hashtags: tags(value('hashtags')),
                  ...(value('scheduledAt')
                    ? {
                        scheduledAt: fromInput(
                          value('scheduledAt'),
                          v.scheduledAt || post.goLiveAt,
                        ),
                      }
                    : {}),
                },
              });
            }
            const added = dialog.querySelector('[data-new-variant]');
            const newField = (n) => added?.querySelector(`[data-n="${n}"]`).value;
            if (added && newField('platform')) {
              await api('add_variant', {
                postId: id,
                variant: {
                  platform: newField('platform'),
                  format: newField('format'),
                  language: newField('language'),
                  hook: newField('hook'),
                  caption: newField('caption'),
                  hashtags: tags(newField('hashtags')),
                  scheduledAt: fromInput(newField('scheduledAt'), post.goLiveAt),
                },
              });
            }
            // FR-29: removal hides the variant (kept in the change log), so confirm first.
            const names = removing.map((v) => `${v.platform} · ${v.format}`).join(', ');
            if (
              removing.length &&
              confirm(
                `Remove ${names} from this post? It leaves the plan but stays in the history.`,
              )
            ) {
              for (const v of removing) await api('remove_variant', { id: v.id });
            }
            for (const row of dialog.querySelectorAll('[data-task]')) {
              const t = post.tasks.find((x) => x.id === row.dataset.task);
              const field = (n) => row.querySelector(`[data-t="${n}"]`);
              if (field('delete').checked) {
                await api('delete_task', { id: t.id });
                continue;
              }
              const patch = {
                title: field('title').value,
                type: field('type').value,
                done: field('done').checked,
                dueAt: fromInput(field('dueAt').value, t.dueAt),
              };
              if (
                patch.title !== t.title ||
                patch.type !== t.type ||
                patch.done !== t.done ||
                patch.dueAt !== t.dueAt
              ) {
                await api('update_task', { id: t.id, patch });
              }
            }
            const fresh = dialog.querySelector('[data-new-task]');
            const freshTitle = fresh.querySelector('[data-t="title"]').value.trim();
            if (freshTitle) {
              await api('add_task', {
                postId: id,
                title: freshTitle,
                type: fresh.querySelector('[data-t="type"]').value,
                dueAt: fromInput(fresh.querySelector('[data-t="dueAt"]').value, post.goLiveAt),
              });
            }
            toast('Saved');
            render();
          } catch (e) {
            toast(e.message);
          }
        };
      }

      document.querySelector('nav').addEventListener('click', (e) => {
        const button = e.target.closest('[data-tab]');
        if (!button) return;
        tab = button.dataset.tab;
        for (const b of document.querySelectorAll('[data-tab]'))
          b.setAttribute('aria-selected', String(b === button));
        render();
      });

      main.addEventListener('click', (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        if (b.dataset.approve) act('approve', { id: b.dataset.approve }, 'Approved');
        if (b.dataset.advance) act('advance', { id: b.dataset.advance }, 'Moved to the next stage');
        if (b.dataset.posted)
          act('mark_posted', { variantId: b.dataset.posted }, 'Marked posted; check-ins created');
        if (b.dataset.edit) openEditor(b.dataset.edit).catch((err) => toast(err.message));
        if (b.dataset.week) {
          weekOffset += Number(b.dataset.week);
          render();
        }
        if (b.dataset.reject) {
          const reason = prompt('Why are you rejecting it? (Claude sees this)');
          if (reason) act('reject', { id: b.dataset.reject, reason }, 'Rejected and archived');
        }
      });

      main.addEventListener('submit', (e) => {
        const form = e.target;
        e.preventDefault();
        if (form.id === 'new-idea') {
          const text = document.getElementById('idea-text').value;
          const source = matchMedia('(pointer: coarse)').matches ? 'phone' : 'pc';
          act('add_idea', { text, source }, 'Idea added');
        } else if (form.dataset.checkin) {
          const metrics = Object.fromEntries(new FormData(form));
          act('log_checkin', { id: form.dataset.checkin, metrics }, 'Check-in saved');
        } else if (form.id === 'new-task') {
          const data = Object.fromEntries(new FormData(form));
          act(
            'add_task',
            { title: data.title, type: data.type, dueAt: fromInput(data.dueAt) },
            'Task added',
          );
        } else if (form.id === 'followers-form') {
          const data = Object.fromEntries(new FormData(form));
          act('log_followers', { platform: data.platform, count: data.count }, 'Followers saved');
        }
      });

      main.addEventListener('click', (e) => {
        if (e.target.closest('[data-send-report]'))
          act('send_report', {}, 'Report sent: Claude can read it now');
        if (e.target.closest('[data-enable-push]')) enablePush().catch((err) => toast(err.message));
        const done = e.target.closest('[data-task-done]');
        if (done)
          act(
            'update_task',
            { id: done.dataset.taskDone, patch: { done: done.checked } },
            done.checked ? 'Done' : 'Not done',
          );
      });

      render();
    </script>
  </body>
</html>
