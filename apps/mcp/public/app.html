<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>Cadence</title>
    <style>
      :root {
        --bg: #f6f5f2;
        --card: #fff;
        --ink: #1c1b19;
        --muted: #6b6860;
        --line: #e4e1da;
        --accent: #3d5afe;
        --warn: #b26a00;
        --err: #c62828;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141413;
          --card: #1f1e1c;
          --ink: #eceae4;
          --muted: #a19e95;
          --line: #34322e;
          --accent: #8c9eff;
          --warn: #ffb74d;
          --err: #ef9a9a;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, sans-serif; }
      header { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 16px 0; z-index: 1; }
      h1 { margin: 0 0 8px; font-size: 20px; }
      nav { display: flex; gap: 4px; }
      nav button { flex: 1; border: 0; background: none; color: var(--muted); padding: 10px 0; font: inherit; border-bottom: 3px solid transparent; min-height: 44px; }
      nav button[aria-selected='true'] { color: var(--ink); border-color: var(--accent); font-weight: 600; }
      main { padding: 16px; max-width: 720px; margin: 0 auto; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .muted { color: var(--muted); font-size: 14px; }
      .pill { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; }
      .warning { color: var(--warn); font-size: 14px; }
      .error { color: var(--err); font-size: 14px; }
      button.act, input, select, textarea { font: inherit; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 8px 12px; }
      button.act { cursor: pointer; }
      button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
      input, textarea, select { width: 100%; }
      label { display: block; margin: 10px 0 4px; font-size: 14px; color: var(--muted); }
      ul { margin: 6px 0 0; padding-left: 18px; }
      #toast { position: fixed; left: 16px; right: 16px; bottom: 16px; padding: 12px 14px; border-radius: 10px; background: var(--ink); color: var(--bg); display: none; }
      dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--ink); width: min(640px, calc(100% - 32px)); }
      dialog::backdrop { background: rgb(0 0 0 / 0.4); }
    </style>
  </head>
  <body>
    <header>
      <h1>Cadence</h1>
      <nav role="tablist">
        <button role="tab" data-tab="inbox" aria-selected="true">Inbox</button>
        <button role="tab" data-tab="week" aria-selected="false">Week</button>
        <button role="tab" data-tab="ideas" aria-selected="false">Ideas</button>
      </nav>
    </header>
    <main id="main" aria-live="polite"></main>
    <dialog id="editor"></dialog>
    <div id="toast" role="status"></div>
    <script>
      // The secret is the last path segment (/app/<secret>); it is sent as a header, never in a query.
      const KEY = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
      const main = document.getElementById('main');
      let tab = 'inbox';
      let weekOffset = 0;

      const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
      const when = (iso) =>
        iso ? new Date(iso).toLocaleString([], { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
      // A local datetime-local value for an ISO time with offset, and back.
      const toInput = (iso) => (iso ? iso.slice(0, 16) : '');
      const fromInput = (value, iso) => (value ? `${value}:00${(iso || '').slice(19) || offset()}` : null);
      const offset = () => {
        const m = -new Date().getTimezoneOffset();
        return `${m < 0 ? '-' : '+'}${String(Math.floor(Math.abs(m) / 60)).padStart(2, '0')}:${String(Math.abs(m) % 60).padStart(2, '0')}`;
      };

      function toast(text) {
        const t = document.getElementById('toast');
        t.textContent = text;
        t.style.display = 'block';
        clearTimeout(toast.timer);
        toast.timer = setTimeout(() => (t.style.display = 'none'), 3000);
      }

      async function api(action, args = {}) {
        const response = await fetch('/api/app', {
          method: 'POST',
          headers: { 'content-type': 'application/json', 'x-cadence-key': KEY },
          body: JSON.stringify({ action, args }),
        });
        if (response.status === 404) throw new Error('This link is not valid. Check the secret in the URL.');
        const body = await response.json();
        if (!response.ok) throw new Error(body.error || 'Something went wrong');
        return body;
      }

      async function act(action, args, done) {
        try {
          await api(action, args);
          toast(done);
          render();
        } catch (e) {
          toast(e.message);
        }
      }

      const warnings = (list) =>
        list.length
          ? `<ul>${list.map((w) => `<li class="${w.severity === 'error' ? 'error' : 'warning'}">${esc(w.rule)}: ${esc(w.message)}</li>`).join('')}</ul>`
          : '<p class="muted">No balance warnings.</p>';

      const variants = (post) =>
        post.variants
          .map(
            (v) => `<div class="row muted"><span class="pill">${esc(v.platform)} · ${esc(v.format)}</span>
              ${v.hook ? `“${esc(v.hook)}”` : ''} ${v.postedAt ? `<span>posted ${esc(when(v.postedAt))}</span>` : ''}</div>`,
          )
          .join('');

      async function renderInbox() {
        const items = await api('inbox');
        if (!items.length) return '<p class="muted">Nothing waiting. Proposals from Claude appear here.</p>';
        return items
          .map(
            ({ post, warnings: w }) => `<article class="card">
              <div class="row"><strong>${esc(post.title)}</strong><span class="pill">${esc(post.pillar)}</span></div>
              <p class="muted">${esc(when(post.goLiveAt))}${post.notes ? ` · ${esc(post.notes)}` : ''}</p>
              ${variants(post)}
              ${warnings(w.filter((x) => !x.postId || x.postId === post.id))}
              <div class="row">
                <button class="act primary" data-approve="${post.id}">Approve</button>
                <button class="act" data-edit="${post.id}">Edit</button>
                <button class="act" data-reject="${post.id}">Reject</button>
              </div>
            </article>`,
          )
          .join('');
      }

      async function renderWeek() {
        const week = await api('week', { offset: weekOffset });
        const byPost = new Map();
        for (const item of week.items) {
          if (!byPost.has(item.postId)) byPost.set(item.postId, { ...item, variants: [] });
          byPost.get(item.postId).variants.push(item);
        }
        const posts = [...byPost.values()];
        return `<div class="row" style="justify-content:space-between;margin-bottom:12px">
            <button class="act" data-week="-1" aria-label="Previous week">←</button>
            <strong>${esc(week.weekStart)} – ${esc(week.weekEnd)}</strong>
            <button class="act" data-week="1" aria-label="Next week">→</button>
          </div>
          ${posts.length ? '' : '<p class="muted">Nothing planned this week.</p>'}
          ${posts
            .map(
              (p) => `<article class="card">
                <div class="row"><strong>${esc(p.title)}</strong><span class="pill">${esc(p.stage)}</span><span class="pill">${esc(p.pillar)}</span></div>
                ${p.variants
                  .map(
                    (v) => `<div class="row" style="margin-top:8px">
                      <span class="muted">${esc(v.platform)} · ${esc(v.format)} · ${esc(when(v.goLiveAt))}</span>
                      ${v.postedAt ? '<span class="pill">posted</span>' : `<button class="act" data-posted="${v.variantId}">Mark posted</button>`}
                    </div>`,
                  )
                  .join('')}
                <div class="row" style="margin-top:10px">
                  ${p.stage === 'proposed' ? `<button class="act primary" data-approve="${p.postId}">Approve</button>` : `<button class="act" data-advance="${p.postId}">Next stage</button>`}
                  <button class="act" data-edit="${p.postId}">Edit</button>
                </div>
              </article>`,
            )
            .join('')}
          <details class="card"><summary>Balance for this week (${week.warnings.length})</summary>${warnings(week.warnings)}</details>`;
      }

      async function renderIdeas() {
        const ideas = await api('ideas');
        return `<form class="card" id="new-idea">
            <label for="idea-text">New idea</label>
            <textarea id="idea-text" rows="2" required placeholder="What could you post?"></textarea>
            <div class="row" style="margin-top:8px"><button class="act primary" type="submit">Add idea</button></div>
          </form>
          ${ideas
            .map(
              (i) => `<article class="card">
                <div class="row"><span>${esc(i.text)}</span><span class="pill">${esc(i.status)}</span></div>
                ${i.latestVerdict ? `<p class="muted">Claude: ${esc(i.latestVerdict.verdict)} (${esc(i.latestVerdict.total)}/15) · ${esc(i.latestVerdict.notes)}</p>` : ''}
              </article>`,
            )
            .join('')}`;
      }

      async function render() {
        main.innerHTML = '<p class="muted">Loading…</p>';
        try {
          main.innerHTML = await { inbox: renderInbox, week: renderWeek, ideas: renderIdeas }[tab]();
        } catch (e) {
          main.innerHTML = `<p class="error">${esc(e.message)}</p>`;
        }
      }

      async function openEditor(id) {
        const post = await api('post', { id });
        const dialog = document.getElementById('editor');
        dialog.innerHTML = `<form method="dialog" id="edit-form">
            <h2 style="margin-top:0">Edit post</h2>
            <label for="e-title">Title</label><input id="e-title" value="${esc(post.title)}" required />
            <label for="e-date">Goes live</label><input id="e-date" type="datetime-local" value="${esc(toInput(post.goLiveAt))}" />
            <label for="e-notes">Notes</label><textarea id="e-notes" rows="2">${esc(post.notes)}</textarea>
            ${post.variants
              .map(
                (v) => `<fieldset class="card" data-variant="${v.id}">
                  <legend>${esc(v.platform)} · ${esc(v.format)}</legend>
                  <label>Hook</label><input data-f="hook" value="${esc(v.hook)}" />
                  <label>Caption</label><textarea data-f="caption" rows="3">${esc(v.caption)}</textarea>
                  <label>Scheduled at (optional)</label><input data-f="scheduledAt" type="datetime-local" value="${esc(toInput(v.scheduledAt))}" />
                </fieldset>`,
              )
              .join('')}
            <div class="row"><button class="act primary" value="save">Save</button><button class="act" value="cancel" formnovalidate>Cancel</button></div>
          </form>`;
        dialog.showModal();
        dialog.onclose = async () => {
          if (dialog.returnValue !== 'save') return;
          try {
            await api('update_post', {
              id,
              patch: {
                title: dialog.querySelector('#e-title').value,
                notes: dialog.querySelector('#e-notes').value,
                goLiveAt: fromInput(dialog.querySelector('#e-date').value, post.goLiveAt),
              },
            });
            for (const fs of dialog.querySelectorAll('[data-variant]')) {
              const v = post.variants.find((x) => x.id === fs.dataset.variant);
              const value = (f) => fs.querySelector(`[data-f="${f}"]`).value;
              await api('update_variant', {
                id: v.id,
                patch: { hook: value('hook'), caption: value('caption'), ...(value('scheduledAt') ? { scheduledAt: fromInput(value('scheduledAt'), v.scheduledAt || post.goLiveAt) } : {}) },
              });
            }
            toast('Saved');
            render();
          } catch (e) {
            toast(e.message);
          }
        };
      }

      document.querySelector('nav').addEventListener('click', (e) => {
        const button = e.target.closest('[data-tab]');
        if (!button) return;
        tab = button.dataset.tab;
        for (const b of document.querySelectorAll('[data-tab]')) b.setAttribute('aria-selected', String(b === button));
        render();
      });

      main.addEventListener('click', (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        if (b.dataset.approve) act('approve', { id: b.dataset.approve }, 'Approved');
        if (b.dataset.advance) act('advance', { id: b.dataset.advance }, 'Moved to the next stage');
        if (b.dataset.posted) act('mark_posted', { variantId: b.dataset.posted }, 'Marked posted; check-ins created');
        if (b.dataset.edit) openEditor(b.dataset.edit).catch((err) => toast(err.message));
        if (b.dataset.week) {
          weekOffset += Number(b.dataset.week);
          render();
        }
        if (b.dataset.reject) {
          const reason = prompt('Why are you rejecting it? (Claude sees this)');
          if (reason) act('reject', { id: b.dataset.reject, reason }, 'Rejected and archived');
        }
      });

      main.addEventListener('submit', (e) => {
        if (e.target.id !== 'new-idea') return;
        e.preventDefault();
        const text = document.getElementById('idea-text').value;
        const source = matchMedia('(pointer: coarse)').matches ? 'phone' : 'pc';
        act('add_idea', { text, source }, 'Idea added');
      });

      render();
    </script>
  </body>
</html>
